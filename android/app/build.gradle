plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def sourceRoot = rootProject.projectDir.parentFile
def sharedPython = layout.buildDirectory.dir('generated/sharedPython')
def packedAssets = layout.buildDirectory.dir('generated/dolbyAssets')
def privateAssets = providers.gradleProperty('dolbyPrivateAssets').orElse(new File(sourceRoot, 'assets').absolutePath)

tasks.register('syncSharedPython', Sync) {
    from(sourceRoot) {
        include 'core.py', 'discovery.py', 'elf_audit.py', 'policy.py', 'policy_rules.py', 'policy_sources.py',
                'patcher_workflow.py', 'adb_mode.py', 'ksu_module.py', 'ksu_boot.py', 'ksu_policy.py'
    }
    into sharedPython
}
tasks.register('syncDolbyAssets', Sync) {
    into packedAssets
    from(new File(sourceRoot, 'assets')) {
        into 'dolby_assets'
        exclude 'payload.zip', 'native/**', 'adb/**', 'selinux/**'
    }
    // Proprietary payload is optional, local-only and never fetched from the network.
    from(privateAssets) { include 'payload.zip'; into 'dolby_assets' }
    from(new File(sourceRoot, 'third_party/selinux/secilc/LICENSE')) { into 'dolby_assets/licenses/secilc' }
    from(new File(sourceRoot, 'third_party/selinux/libsepol/LICENSE')) { into 'dolby_assets/licenses/libsepol' }
}

android {
    namespace 'io.github.magaking.dolbybuilder'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.magaking.dolbybuilder'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.2.2-stock-label-fix'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir packedAssets
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libsecilc.so' } }
    buildTypes { release { minifyEnabled false } }
}
chaquopy {
    defaultConfig {
        version = '3.12'
        pip { install 'pyelftools==0.33' }
    }
    sourceSets.main.srcDir sharedPython
}
tasks.configureEach {
    if ((name.startsWith('generate') || name.startsWith('merge')) && name.endsWith('PythonSources')) dependsOn 'syncSharedPython'
    if (name.startsWith('merge') && name.endsWith('Assets')) dependsOn 'syncDolbyAssets'
}
tasks.named('preBuild') { dependsOn 'syncSharedPython', 'syncDolbyAssets' }
